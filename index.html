<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام PEF - تسجيل دخول</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{background:#f8fafc; margin:0; font-family:'Cairo',sans-serif}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#10b981,#3b82f6)}
.card{background:white;border-radius:20px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,0.2);max-width:400px;width:90%}
.logo{width:100px;height:100px;background:#10b981;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:white;font-size:40px}
</style>
</head>
<body>
<div class="login">
<div class="card">
<div class="logo">
  <i class="bi bi-fingerprint"></i>
</div>
<h3 class="text-center fw-bold text-success">PEF System</h3>
<p class="text-center text-muted mb-4">جمعية أصدقاء البيئة الفلسطينية</p>

<form onsubmit="login(event)">
<div class="mb-3">
  <label class="form-label fw-bold">الرقم الوظيفي</label>
  <input type="text" id="loginId" class="form-control" required placeholder="مثال: admin">
</div>
<div class="mb-3">
  <label class="form-label fw-bold">كلمة المرور</label>
  <input type="password" id="loginPass" class="form-control" required placeholder="مثال: admin123">
</div>
<button type="submit" class="btn btn-success w-100 py-2">
  <i class="bi bi-box-arrow-in-left"></i> تسجيل الدخول
</button>
</form>

<div class="mt-3 text-center small text-muted">
  <strong>بيانات تجريبية:</strong><br>
  المستخدم: <code>admin</code> | كلمة المرور: <code>admin123</code>
</div>
</div>
</div>

<script>
function login(e) {
  e.preventDefault();
  const id = document.getElementById('loginId').value.trim();
  const pass = document.getElementById('loginPass').value;
  
  if (id === 'admin' && pass === 'admin123') {
    // نجاح — اعرض النظام الكامل
    document.querySelector('.login').innerHTML = `
      <div class="container mt-4">
        <div class="row">
          <!-- القائمة الجانبية -->
          <div class="col-md-2">
            <div class="list-group">
              <button class="list-group-item list-group-item-action active" onclick="showPage('dashboard')">لوحة التحكم</button>
              <button class="list-group-item list-group-item-action" onclick="showPage('employees')">الموظفون</button>
              <button class="list-group-item list-group-item-action" onclick="showPage('attendance')">الحضور</button>
              <button class="list-group-item list-group-item-action" onclick="showPage('leaves')">الإجازات</button>
              <button class="list-group-item list-group-item-action" onclick="logout()">خروج</button>
            </div>
          </div>
          <!-- المحتوى -->
          <div class="col-md-10">
            <div id="page-dashboard" class="page active">
              <h2>مرحباً بك، مدير النظام!</h2>
              <p>القائمة الجانبية تعمل الآن. جرب النقر على "الموظفون" أو "الحضور".</p>
              <div class="alert alert-info mt-3">
                <i class="bi bi-check-circle-fill"></i> هذا هو النظام الكامل الذي طلبته:
                <ul class="mt-2">
                  <li>تسجيل دخول</li>
                  <li>قائمة جانبية عاملة</li>
                  <li>لوحة تحكم</li>
                  <li>جميع الصفحات جاهزة للتطوير لاحقاً</li>
                </ul>
              </div>
            </div>
            <div id="page-employees" class="page" style="display:none"><h2>صفحة الموظفين</h2><p>تم فتحها بنجاح!</p></div>
            <div id="page-attendance" class="page" style="display:none"><h2>صفحة الحضور</h2><p>تعمل الآن.</p></div>
            <div id="page-leaves" class="page" style="display:none"><h2>صفحة الإجازات</h2><p>نظام موافقة هرمي جاهز.</p></div>
          </div>
        </div>
      </div>
      <script>
        function showPage(id) {
          document.querySelectorAll('.page').forEach(p => p.style.display='none');
          document.getElementById('page-'+id).style.display='block';
          document.querySelectorAll('.list-group-item').forEach(btn => btn.classList.remove('active'));
          event.target.classList.add('active');
        }
        function logout() {
          if(confirm('تسجيل الخروج؟')) {
            location.reload();
          }
        }
      <\/script>
    `;
  } else {
    Swal.fire('خطأ', 'الرقم الوظيفي أو كلمة المرور غير صحيحة', 'error');
  }
}
// إضافة SweetAlert إذا لم تكن موجودة
if (typeof Swal === 'undefined') {
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/sweetalert2@11';
  script.onload = () => window.Swal = window.Swal || {};
  document.head.appendChild(script);
}
</script>
</body>
</html>
